events {
    worker_connections 1024;
}

http {
    # Optimización requerida: Keepalive
    keepalive_timeout 65;

    # Zona de memoria compartida para la caché (10MB de keys, max 1GB de caché en disco)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=microservices_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream users_api {
        server user_service:8001;
    }

    upstream products_api {
        server product_service:8002;
    }

    upstream keycloak_auth {
        server keycloak:8080;
    }

    server {
        listen 80;

        # 1. Rutas para Keycloak
        location /auth/ {
            proxy_pass http://keycloak_auth/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Rutas para User Service
        location /api/users/ {
            # Rewrite para limpiar el prefijo antes de enviarlo a FastAPI
            rewrite ^/api/users/(.*)$ /$1 break;
            
            proxy_pass http://users_api;
            proxy_set_header Host $host;
            
            # Configuración de Caché para respuestas GET
            proxy_cache microservices_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        }

        # 3. Rutas para Product Service
        location /api/products/ {
            # Rewrite para limpiar el prefijo
            rewrite ^/api/products/(.*)$ /$1 break;
            
            proxy_pass http://products_api;
            proxy_set_header Host $host;

            proxy_cache microservices_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        }

	# 4. Rutas para Frontend
	location / { proxy_pass http://fronted;
        } 
    }
}
